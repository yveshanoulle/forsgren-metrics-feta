# yamllint rules, the same as forsgren's own .yamllint.yml, so a workflow
# reads one way in forsgren and here. The Checks workflow
# (.github/workflows/checks.yml) lints every tracked YAML file with them,
# this one included.

extends: default

rules:
  line-length:
    max: 200          # workflow files contain long bash commands
    level: error
  document-start: disable   # not required for GitHub Actions
  truthy:
    allowed-values: ['true', 'false', 'on', 'off']  # 'on' is valid in GH Actions
  colons:
    max-spaces-after: -1  # allow alignment
  braces:
    min-spaces-inside: 0
    max-spaces-inside: 1
  brackets:
    min-spaces-inside: 0
    max-spaces-inside: 1
